<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>汉诺塔接力赛 · 我的步骤</title>
<style>
  :root{
    --bg:#f2f5fa; --card:#ffffff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand2:#7c3aed; --ok:#16a34a; --warn:#f59e0b;
    --pa:#ef4444; --pb:#f59e0b; --pc:#22c55e;
    --disk1:#f97316; --disk2:#eab308; --disk3:#22c55e; --disk4:#3b82f6; --disk5:#a855f7;
    --shadow:0 4px 16px rgba(15,23,42,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --card:#141c2e; --text:#e8eefc; --sub:#94a3b8; --line:#24304a;
      --brand:#3b82f6; --brand2:#8b5cf6; --shadow:0 4px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:12px 14px 26px;}
  .hide{display:none !important;}
  .card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px;}
  .title{font-size:20px; font-weight:900; text-align:center; margin:4px 0 2px;}
  .subtitle{font-size:13px; color:var(--sub); text-align:center; margin-bottom:14px;}
  .tip{font-size:12px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}

  /* ---------- 选号页 ---------- */
  .who-list{display:flex; flex-direction:column; gap:10px;}
  .who-item{
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; width:100%; text-align:left;
    border:2px solid var(--line); background:var(--card); box-shadow:var(--shadow);
  }
  .who-item.sel{border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.18);}
  .who-item .no{
    width:44px; height:44px; flex:0 0 44px; border-radius:50%; color:#fff; font-weight:900; font-size:19px;
    display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--brand),var(--brand2));
  }
  .who-item .mid{flex:1; min-width:0;}
  .who-item .nm{font-size:19px; font-weight:900; word-break:break-all;}
  .who-item .st{font-size:12.5px; color:var(--sub); margin-top:3px;}
  .who-item .go{font-size:14px; font-weight:800; color:var(--brand); flex:0 0 auto;}
  .name-in{width:100%; font-size:17px; font-weight:700; padding:8px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:inherit;}
  .switch{display:flex; align-items:center; justify-content:space-between; padding:12px 0; font-size:15px; font-weight:700;}
  .switch input{width:50px; height:29px; accent-color:var(--brand);}

  /* ---------- 我的视图 ---------- */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .btn-back{padding:8px 12px; border-radius:12px; background:var(--card); color:var(--text);
    font-size:14px; font-weight:800; box-shadow:var(--shadow); border:1px solid var(--line);}
  .me-badge{font-size:15px; font-weight:900; color:var(--sub); flex:1; text-align:right;}

  .action{text-align:center;}
  .disk-tag{display:inline-block; padding:7px 16px; border-radius:12px; font-size:17px; font-weight:900;
    color:#fff; margin:2px 0 10px; box-shadow:var(--shadow);}
  .big{font-size:23px; font-weight:800; line-height:1.6;}
  .pill{display:inline-block; padding:4px 16px; border-radius:999px; color:#fff; font-weight:900;}
  .p-A{background:var(--pa);} .p-B{background:var(--pb);} .p-C{background:var(--pc);}
  .arrow{font-size:28px; font-weight:900; color:var(--sub); margin:0 6px;}
  .order-tip{font-size:12.5px; color:var(--sub); margin-top:10px; line-height:1.7;}

  .towers{display:flex; gap:8px; align-items:flex-end; justify-content:center; padding:12px 0 0;}
  .tw{flex:1; text-align:center; position:relative; min-height:140px; display:flex; flex-direction:column; justify-content:flex-end;}
  .tw .cap{font-size:13px; font-weight:800; margin-bottom:6px; color:var(--sub);}
  .tw.active .cap{color:var(--brand);}
  .base{height:8px; width:92%; margin:0 auto; background:var(--line); border-radius:4px;}
  .pole{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:8px; height:112px; background:var(--line); border-radius:4px; z-index:0;}
  .stack{position:relative; z-index:1; display:flex; flex-direction:column-reverse; align-items:center; padding-bottom:8px;}
  .disk{height:14px; border-radius:7px; margin-top:3px; color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.18);}
  .disk.moving{animation:pulse 1s infinite; outline:2px solid var(--brand); outline-offset:2px;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .tw.from .cap::after{content:" 出"; color:var(--pa);}
  .tw.to .cap::after{content:" 入"; color:var(--ok);}

  .mylist{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .ml{min-width:48px; padding:6px 8px; border-radius:10px; font-size:13px; font-weight:800;
    background:var(--line); color:var(--sub); text-align:center;}
  .ml.done{background:rgba(22,163,74,.15); color:var(--ok);}
  .ml.cur{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 3px 10px rgba(37,99,235,.35); transform:scale(1.08);}
  .ml small{display:block; font-size:10px; font-weight:700; opacity:.85;}

  /* ---------- 按钮 ---------- */
  button{font-family:inherit; border:none; cursor:pointer;}
  .btn-main{width:100%; min-height:78px; border-radius:20px; font-size:23px; font-weight:900; color:#fff;
    background:linear-gradient(135deg,#16a34a,#059669); box-shadow:0 6px 18px rgba(22,163,74,.35);
    display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 10px;}
  .btn-main:active{transform:scale(.98);}
  .btn-row{display:flex; gap:10px;}
  .btn-sub{flex:1; min-height:48px; border-radius:14px; background:var(--card); color:var(--text);
    font-size:15px; font-weight:700; box-shadow:var(--shadow); border:1px solid var(--line);}
  .btn-gray{background:var(--line); color:var(--sub);}
  .btn-block{width:100%; min-height:56px; border-radius:16px; font-size:18px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand2)); box-shadow:var(--shadow); margin-top:6px;}
  .banner{border-radius:16px; padding:16px; font-size:17px; font-weight:800; text-align:center; margin:4px 0 12px;
    line-height:1.6; color:#fff; background:linear-gradient(135deg,#16a34a,#059669);}
  .banner small{display:block; font-size:13px; font-weight:600; opacity:.92; margin-top:5px;}
  .banner.blue{background:linear-gradient(135deg,var(--brand),var(--brand2));}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 选号页 ============ -->
  <div id="pagePick">
    <div class="card">
      <div class="title">🏃 汉诺塔接力赛</div>
      <div class="subtitle">5 层 · 31 步最快路线 · 5 人轮流各跑一步</div>
    </div>
    <div class="card">
      <div class="title" style="font-size:17px;">我是几号？</div>
      <div class="subtitle" style="margin-bottom:10px;">选一次就记住，之后只显示你自己的步骤</div>
      <div class="who-list" id="whoList"></div>
    </div>
    <div class="card">
      <div class="switch">🔊 语音播报我的步骤
        <input type="checkbox" id="voiceOn">
      </div>
      <div class="switch">💡 比赛期间屏幕常亮
        <input type="checkbox" id="wakeOn" checked>
      </div>
    </div>
    <button class="btn-sub btn-gray" style="width:100%;" id="btnResetAll">⟲ 重置到初始状态</button>
    <div class="tip">起点 A 柱（从上到下 小→大），终点 C 柱<br>每人用自己的手机，各自推进自己的步骤</div>
  </div>

  <!-- ============ 我的视图 ============ -->
  <div id="pageMe" class="hide">
    <div class="topbar">
      <button class="btn-back" id="btnBack">← 换人</button>
      <div class="me-badge" id="meBadge">第 1 位 · 队员1</div>
    </div>

    <div class="card" id="cardRun">
      <div class="action">
        <div class="disk-tag" id="diskTag"></div>
        <div class="big" id="actText"></div>
        <div class="order-tip" id="orderTip"></div>
        <div class="towers" id="towers"></div>
        <div class="mylist" id="myList"></div>
      </div>
      <button class="btn-main" id="btnDone">✓ 我完成了</button>
      <div class="btn-row">
        <button class="btn-sub" id="btnUndo">↩ 撤销上一步</button>
        <button class="btn-sub btn-gray" id="btnResetMe">⟲ 重置我的进度</button>
      </div>
      <button class="btn-sub btn-gray" style="width:100%;margin-top:10px;" id="btnResetAll2">⟲ 重置到初始状态（清空全部）</button>
      <div class="tip">跑回来点绿按钮，自动切到你的下一步</div>
    </div>

    <div class="card hide" id="cardFinish">
      <div class="banner blue" id="finBanner"></div>
      <div class="mylist" id="myList2"></div>
      <button class="btn-block" id="btnBackPick">← 返回</button>
      <div class="tip">原地待命，等其他队友跑完剩下的步骤</div>
    </div>
  </div>

</div>

<script>
/* ===== 31 步最快路线：[步序, 源柱, 目标柱, 盘号(1最小~5最大)] ===== */
const MOVES = [
  [1,'A','C',1],[2,'A','B',2],[3,'C','B',1],[4,'A','C',3],[5,'B','A',1],[6,'B','C',2],
  [7,'A','C',1],[8,'A','B',4],[9,'C','B',1],[10,'C','A',2],[11,'B','A',1],[12,'C','B',3],
  [13,'A','C',1],[14,'A','B',2],[15,'C','B',1],[16,'A','C',5],[17,'B','A',1],[18,'B','C',2],
  [19,'A','C',1],[20,'B','A',3],[21,'C','B',1],[22,'C','A',2],[23,'B','A',1],[24,'B','C',4],
  [25,'A','C',1],[26,'A','B',2],[27,'C','B',1],[28,'A','C',3],[29,'B','A',1],[30,'B','C',2],
  [31,'A','C',1]
];
const DISK_NAME = {1:'最小',2:'第2小',3:'中间',4:'第2大',5:'最大'};
const DISK_W    = {1:36,2:48,3:60,4:72,5:84};
const DISK_COLOR= {1:'var(--disk1)',2:'var(--disk2)',3:'var(--disk3)',4:'var(--disk4)',5:'var(--disk5)'};
const KEY = 'hanoi-relay-v4';

/* ===== 状态（每台手机各存各的）===== */
let S = {
  names:['队员1','队员2','队员3','队员4','队员5'],
  me:null,               // 我选的序号 0-4
  done:[0,0,0,0,0],      // 各人已完成的步数（本机通常只推进自己那一项）
  voice:false, wake:true
};
const owner   = n => (n-1) % 5;
const mySteps = i => MOVES.filter(m=>owner(m[0])===i).map(m=>m[0]);
function myNext(i){ const s = mySteps(i); return S.done[i] < s.length ? s[S.done[i]] : null; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY)||'null');
    if(d && Array.isArray(d.names) && Array.isArray(d.done)) S = Object.assign(S, d);
  }catch(e){}
}

/* ===== 塔状态推演 ===== */
function stateAt(k){
  const p = {A:[5,4,3,2,1], B:[], C:[]};   // 末尾为顶部（最小盘）
  for(let i=0;i<k && i<31;i++){ const [,f,t] = MOVES[i]; p[t].push(p[f].pop()); }
  return p;
}
function renderTowers(g){
  const p = stateAt(g-1), cur = MOVES[g-1];
  let html = '';
  ['A','B','C'].forEach(c=>{
    const cls = cur[1]===c ? 'from' : (cur[2]===c ? 'to' : '');
    html += '<div class="tw '+cls+' '+(cls?'active':'')+'"><div class="cap">'+c+' 柱</div><div class="pole"></div><div class="stack">';
    p[c].forEach(d=>{
      const mv = (d===cur[3] && cur[1]===c) ? ' moving' : '';
      html += '<div class="disk'+mv+'" style="width:'+DISK_W[d]+'%;background:'+DISK_COLOR[d]+'">'+d+'</div>';
    });
    html += '</div><div class="base"></div></div>';
  });
  document.getElementById('towers').innerHTML = html;
}
function renderMyList(i, el){
  const s = mySteps(i), done = S.done[i];
  el.innerHTML = s.map((g,idx)=>{
    const m = MOVES[g-1];
    const cls = idx<done ? 'done' : (idx===done ? 'cur' : '');
    return '<div class="ml '+cls+'">'+g+'<small>'+m[1]+'→'+m[2]+'</small></div>';
  }).join('');
}

/* ===== 选号页 ===== */
function renderPick(){
  const box = document.getElementById('whoList');
  box.innerHTML = '';
  S.names.forEach((n,i)=>{
    const t = mySteps(i).length, d = Math.min(S.done[i], t);
    const div = document.createElement('div');
    div.className = 'who-item' + (S.me===i ? ' sel' : '');
    div.innerHTML =
      '<div class="no">'+(i+1)+'</div><div class="mid">'
    + '<input class="name-in" value="'+String(n).replace(/"/g,'&quot;')+'" maxlength="8">'
    + '<div class="st">负责 '+t+' 步 · 已跑 '+d+' 步'+(d>=t?' · 已全部完成':'')+'</div></div>'
    + '<div class="go">'+(S.me===i?'我的 · 进入 ›':'选我 ›')+'</div>';
    div.querySelector('input').addEventListener('click', e=>e.stopPropagation());
    div.querySelector('input').addEventListener('input', e=>{ S.names[i] = e.target.value || ('队员'+(i+1)); save(); });
    div.addEventListener('click', ()=>pick(i));
    box.appendChild(div);
  });
}
function pick(i){
  S.me = i; save();
  show('pageMe'); renderMe(); keepAwake();
}

/* ===== 我的视图 ===== */
function renderMe(){
  const i = S.me;
  document.getElementById('meBadge').textContent = '第 '+(i+1)+' 位 · '+S.names[i];
  const g = myNext(i);
  if(g === null){ renderFinish(i); return; }

  document.getElementById('cardRun').classList.remove('hide');
  document.getElementById('cardFinish').classList.add('hide');

  const [,f,t,d] = MOVES[g-1];
  const tag = document.getElementById('diskTag');
  tag.textContent = '我的第 '+(S.done[i]+1)+' / '+mySteps(i).length+' 步 · 搬 '+d+' 号盘（'+DISK_NAME[d]+'）';
  tag.style.background = DISK_COLOR[d];
  document.getElementById('actText').innerHTML =
    '从 <span class="pill p-'+f+'">'+f+' 柱</span><span class="arrow">→</span><span class="pill p-'+t+'">'+t+' 柱</span>';

  const prev = g>1 ? MOVES[g-2] : null;
  document.getElementById('orderTip').innerHTML =
    '这是全队的第 '+g+' 步'
    + (prev ? ' · 上一棒由 <b>'+S.names[owner(g-1)]+'</b> 完成（'+prev[1]+' → '+prev[2]+'）' : ' · 全队第 1 步，由你打头阵')
    + '<br>下图是你出发时，三根柱子应有的样子';

  renderTowers(g);
  renderMyList(i, document.getElementById('myList'));
  speak(S.names[i]+'，'+d+'号盘，从'+f+'柱移到'+t+'柱');
}

function onDone(){
  const i = S.me;
  if(myNext(i) === null) return;
  S.done[i]++; save();
  if(navigator.vibrate) navigator.vibrate(30);
  if(myNext(i) === null){ renderFinish(i); return; }
  renderMe();
}
/* 重置到初始状态：清空所有人的进度、名字和选号，回到选号页 */
function resetAll(){
  if(!confirm('重置到初始状态？\n所有人的进度、名字和你的选号都会清空，回到刚打开的样子。')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = {
    names:['队员1','队员2','队员3','队员4','队员5'],
    me:null,
    done:[0,0,0,0,0],
    voice:S.voice, wake:S.wake     // 语音/常亮属于个人偏好，保留
  };
  save();
  show('pagePick'); renderPick();
}
function doUndo(){
  const i = S.me;
  if(S.done[i] <= 0) return;
  S.done[i]--; save(); renderMe();
}
function renderFinish(i){
  document.getElementById('cardRun').classList.add('hide');
  document.getElementById('cardFinish').classList.remove('hide');
  document.getElementById('finBanner').innerHTML =
    '🎊 你的 '+mySteps(i).length+' 步全部完成！<small>'+S.names[i]+' · 原地待命，等其他队友</small>';
  renderMyList(i, document.getElementById('myList2'));
  speak('你的步骤全部完成');
}

/* ===== 语音 / 常亮 ===== */
function speak(txt){
  if(!S.voice || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang='zh-CN'; u.rate=1.05; speechSynthesis.speak(u); }catch(e){}
}
let wl = null;
async function keepAwake(){
  if(!S.wake || !navigator.wakeLock) return;
  try{ wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
function show(id){
  ['pagePick','pageMe'].forEach(p=>document.getElementById(p).classList.toggle('hide', p!==id));
}

/* ===== 绑定 ===== */
document.getElementById('btnDone').onclick    = onDone;
document.getElementById('btnUndo').onclick    = doUndo;
document.getElementById('btnBack').onclick    = ()=>{ show('pagePick'); renderPick(); };
document.getElementById('btnBackPick').onclick= ()=>{ show('pagePick'); renderPick(); };
document.getElementById('btnResetAll').onclick  = resetAll;   // 选号页
document.getElementById('btnResetAll2').onclick = resetAll;   // 我的视图
document.getElementById('btnResetMe').onclick = ()=>{
  if(confirm('把你的进度清零，从你的第 1 步重新开始？')){ S.done[S.me] = 0; save(); renderMe(); }
};
document.getElementById('voiceOn').onchange = e=>{ S.voice = e.target.checked; save(); };
document.getElementById('wakeOn').onchange  = e=>{ S.wake = e.target.checked; save(); if(S.wake) keepAwake(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S.wake) keepAwake(); });

/* ===== 启动 ===== */
load();
document.getElementById('voiceOn').checked = S.voice;
document.getElementById('wakeOn').checked  = S.wake;
if(S.me != null){ show('pageMe'); renderMe(); }
else{ renderPick(); }
</script>
</body>
</html>
